let state=JSON.parse(localStorage.getItem('pradumProgress')||'{}'), current=null, idx=0, selected=null, score=0;
function save(){localStorage.setItem('pradumProgress',JSON.stringify(state))}
function home(){current=null;render()}
function render(){let L=document.getElementById('lang').value;if(current) return quiz();let s=document.getElementById('screen');s.innerHTML='<div class="grid">'+subjects.map(([id,ic,en,hi])=>{let p=state[id]||0;return `<div class="card subject" onclick="openSubject('${id}')"><div class="icon">${ic}</div><h2>${L==='hi'?hi:en}</h2><div class="muted">${L==='hi'?'25 प्रश्न • Level':'25 Questions • Level'} ${Math.min(p+1,10)}</div><div class="level"><span class="pill">${p>=1?'Level 2 🔓':'Level 1 🔓'}</span><span>›</span></div></div>`}).join('')+'</div><div class="grid"><div class="card yt"><h2>▶️ Pradumn Tiwari – YouTube</h2><p class="muted">मेरे YouTube चैनल पर सीखने और नए वीडियो देखें।</p><a href="https://www.youtube.com/@tiwaripradum1008" target="_blank" rel="noopener">Visit YouTube</a></div><div class="card video"><h2>🎥 Learning Videos</h2><p class="muted">Maths और Reasoning के Hindi learning videos के लिए आपका YouTube channel जोड़ा गया है।</p><button class="btn dark" onclick="location.href='https://www.youtube.com/@tiwaripradum1008'">Videos देखें</button></div></div>'}
function openSubject(id){let p=state[id]||0;let level=Math.min(p+1,10);document.getElementById('screen').innerHTML=`<div class="card"><button class="btn dark" onclick="home()">← Home</button><h2>${subjects.find(x=>x[0]===id)[1]} ${subjects.find(x=>x[0]===id)[2]}</h2><p class="muted">Level ${level}: 25 questions. अगले Level के लिए 25/25 सही जरूरी है।</p><div class="grid">${[1,2,3,4,5].map(n=>`<div class="card ${n>level?'locked':''}"><b>Level ${n}</b><p class="muted">${n>level?'🔒 पहले पिछला Level 25/25 करें':'25 Questions'}</p>${n<=level?`<button class="btn dark" onclick="start('${id}',${n})">Start Test</button>`:''}</div>`).join('')}</div></div>`}
function start(id,level){current={id,level};idx=0;selected=null;score=0;quiz()}
function quiz(){let q=banks[current.id][idx%25];let L=document.getElementById('lang').value;document.getElementById('screen').innerHTML=`<div class="card quiz"><div class="muted">${subjects.find(x=>x[0]===current.id)[2]} • Level ${current.level} • Question ${idx+1}/25</div><div class="bar" style="margin:12px 0"><i style="width:${(idx/25)*100}%"></i></div><h2>${q[0]}</h2>${q[1].map((o,n)=>`<button class="option ${selected===n?'selected':''}" onclick="pick(${n})">${String.fromCharCode(65+n)}. ${o}</button>`).join('')}<div class="nav"><button class="btn dark" onclick="next()">${idx===24?'Submit Test':'Next →'}</button><button class="btn" onclick="openSubject('${current.id}')">Exit</button></div></div>`}
function pick(n){selected=n;quiz()}
function next(){if(selected===null){alert('पहले एक उत्तर चुनें।');return}let q=banks[current.id][idx%25];if(selected===q[2])score++;if(idx<24){idx++;selected=null;quiz()}else finish()}
function finish(){let id=current.id,passed=score===25,p=state[id]||0;if(passed && current.level>p)state[id]=Math.min(current.level,10);save();document.getElementById('screen').innerHTML=`<div class="card result"><h1>${passed?'🎉 Level Clear!':'📘 Test Complete'}</h1><h2>Score: ${score}/25</h2><p class="${passed?'success':'danger'}">${passed?'अगला Level unlock हो गया है।':'अगला Level unlock करने के लिए 25/25 चाहिए।'}</p><button class="btn dark" onclick="openSubject('${id}')">Level पर वापस जाएँ</button><button class="btn" onclick="start('${id}',${current.level})">🔄 Try Again</button></div>`}
let deferred;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e});document.getElementById('install').onclick=async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null}else alert('Chrome menu ⋮ खोलकर “Add to Home screen” या “Install app” चुनें।')};
render();
</script></body></html>
