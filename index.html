let qs=[],i=0,score=0,answers=[];
function start(cat){
  let pool=cat==='all'?data:data.filter(x=>x.category===cat);
  pool=[...pool];
  for(let k=pool.length-1;k>0;k--){let j=Math.floor(Math.random()*(k+1));[pool[k],pool[j]]=[pool[j],pool[k]];}
  qs=pool.slice(0,Math.min(10,pool.length)); i=0; score=0; answers=[]; show();
}
function show(){
  const q=qs[i];
  document.getElementById('quiz').innerHTML=`<div class="info">प्रश्न ${i+1} / ${qs.length}</div><h2>${q.q}</h2>`+q.options.map((x,n)=>`<button onclick="ans(${n})">${String.fromCharCode(65+n)}) ${x}</button>`).join('');
}
function ans(n){
  const q=qs[i]; const ok=n===q.answer; if(ok)score++;
  answers.push({q:q.q,selected:q.options[n],correct:q.options[q.answer],explanation:q.explanation,ok});
  i++; if(i<qs.length){show();} else {showResult();}
}
function showResult(){
  const total=qs.length, wrong=total-score;
  let details=answers.map((a,n)=>`<div class="card" style="margin:12px 0;padding:16px"><b>${n+1}. ${a.q}</b><p class="info">आपका उत्तर: <strong>${a.selected}</strong><br>सही उत्तर: <strong>${a.correct}</strong><br>${a.explanation}</p></div>`).join('');
  document.getElementById('quiz').innerHTML=`<div class="score">🎉 Quiz पूरा!</div><h2>आपका Score: ${score} / ${total}</h2><p class="info">✅ सही: ${score} &nbsp; ❌ गलत: ${wrong} &nbsp; 📝 कुल: ${total}</p><button class="primary" onclick="start('all')">🔄 Try Again</button><div style="margin-top:18px"><h2>उत्तर और समाधान</h2>${details}</div>`;
}
</script>
